services:
  postgres:
    image: postgres:16-alpine
    container_name: fss-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fss}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?need POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fitness_space_station}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    # 只在内网暴露，不映射到宿主机
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fss} -d ${POSTGRES_DB:-fitness_space_station}"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: fss-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?need MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ./data/meili:/meili_data
    expose:
      - "7700"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fss-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fss}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fitness_space_station}?schema=public
      JWT_SECRET: ${JWT_SECRET:?need JWT_SECRET}
      PORT: "3000"
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      NODE_ENV: production
    volumes:
      - ./data/uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    expose:
      - "3000"

  web:
    image: nginx:1.27-alpine
    container_name: fss-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/web-dist:/usr/share/nginx/html:ro
      - ./data/uploads:/usr/share/nginx/uploads:ro
    depends_on:
      - api
